# Grouped dependency updates (npm + GitHub Actions). Free on public repos.
version: 2
updates:
  - package-ecosystem: npm
    directory: /cost-share-app
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 5
    groups:
      expo-ecosystem:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react-native*"
          - "@react-native*"
      next-web:
        patterns:
          - "next"
          - "@next/*"
          - "react"
          - "react-dom"
      supabase-js:
        patterns:
          - "@supabase/*"
      dev-tooling:
        patterns:
          - "eslint*"
          - "typescript"
          - "prettier*"
          - "turbo"
          - "jest*"
          - "@types/*"
      size-and-lighthouse:
        patterns:
          - "@lhci/*"
          - "@size-limit/*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
