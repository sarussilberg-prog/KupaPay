# Apply pending Supabase migrations to development when dev is updated.
name: Deploy staging — Supabase migrations

on:
  push:
    branches: [dev]
    paths:
      - 'cost-share-app/supabase/migrations/**'
      - 'cost-share-app/supabase/config.toml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only (drift check + db push --dry-run, no apply)
        type: boolean
        default: false

concurrency:
  group: deploy-staging-supabase
  cancel-in-progress: false

jobs:
  supabase-migrations:
    name: Push migrations to development
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Destructive SQL guard (new migrations in push)
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: bash scripts/supabase-destructive-migration-check.sh

      - name: Plan migrations (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        env:
          SUPABASE_ENV: development
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
          DRY_RUN: '1'
        run: bash scripts/supabase-ci-db-push.sh

      - name: Apply pending migrations
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        env:
          SUPABASE_ENV: development
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
        run: bash scripts/supabase-ci-db-push.sh

  verify-staging-db:
    name: Verify development DB (post-migrate)
    needs: supabase-migrations
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Post-deploy DB smoke
        env:
          SUPABASE_ENV: development
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
        run: bash scripts/ci-staging-db-smoke.sh
