name: Bump app version (manual)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver segment to increment (or skip to leave version unchanged)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - none

concurrency:
  group: version-bump-main
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version on main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ADMIN_PAT }}

      - name: Bump packages/shared/version.json
        if: inputs.bump != 'none'
        run: |
          set -euo pipefail
          VERSION_FILE="cost-share-app/packages/shared/version.json"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            current=$(jq -r '.version' "$VERSION_FILE")
            IFS='.' read -r major minor patch <<< "$current"
            case "${{ inputs.bump }}" in
              patch) new="${major}.${minor}.$((patch + 1))" ;;
              minor) new="${major}.$((minor + 1)).0" ;;
              major) new="$((major + 1)).0.0" ;;
              *) echo "No bump selected"; exit 0 ;;
            esac
            jq -c --arg v "$new" '.version = $v | .marketingVersion = $v' "$VERSION_FILE" > tmp.json && mv tmp.json "$VERSION_FILE"
            git add "$VERSION_FILE"
            git commit -m "chore: bump version ${current} → ${new}"
            if git push origin HEAD:main; then
              echo "✅ Bumped ${current} → ${new}"
              exit 0
            fi
            echo "main moved during bump; retrying (${attempt}/3)"
          done
          echo "::error::failed to bump version after 3 attempts"
          exit 1
