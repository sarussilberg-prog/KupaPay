name: CI performance

on:
  workflow_call:

concurrency:
  group: ci-perf-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  mobile-query-budgets:
    name: Mobile Supabase budgets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cost-share-app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:performance

  load-test-manifest:
    name: MAU load-test manifest (#425)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run test:load-test

  bundle-size:
    name: Bundle size budgets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cost-share-app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: bash scripts/ci-bundle-size.sh

  lighthouse-next:
    name: Lighthouse (Next.js local)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cost-share-app/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Lighthouse (retry in script; advisory — does not fail CI gate)
        id: lighthouse
        run: bash scripts/ci-lighthouse-next.sh
      - name: Lighthouse advisory summary
        if: steps.lighthouse.outcome == 'failure'
        run: |
          echo "::warning::Lighthouse scores below lighthouserc.cjs thresholds or run failed twice. This job is non-blocking; fix perf regressions or tune thresholds. Reports are linked in the step log above."

  performance-gate:
    name: Performance gate
    needs: [mobile-query-budgets, bundle-size, lighthouse-next]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require bundle + query budgets
        run: |
          set -euo pipefail
          if [[ "${{ needs.mobile-query-budgets.result }}" != "success" ]]; then
            echo "::error::Mobile Supabase budget checks failed"
            exit 1
          fi
          if [[ "${{ needs.bundle-size.result }}" != "success" ]]; then
            echo "::error::Bundle size budget failed"
            exit 1
          fi
          if [[ "${{ needs.lighthouse-next.result }}" != "success" ]]; then
            echo "::warning::Lighthouse advisory failed (non-blocking)"
          fi
          echo "✅ Performance gate — required budgets passed"
