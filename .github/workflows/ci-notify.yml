# Fail-loud: comment on the PR when CI fails (does not spam on success).
name: CI failure notify

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  notify-pr:
    name: Notify PR on CI failure
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Comment on pull request
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const prs = run.pull_requests || [];
            if (prs.length === 0) {
              core.info('No PR linked to workflow_run');
              return;
            }
            const prNumber = prs[0].number;
            const url = run.html_url;
            const body = [
              '### CI failed',
              '',
              `Workflow **${run.name}** failed on \`${run.head_branch}\`.`,
              '',
              `[Open the run](${url}) — fix failing checks before merge (auto-merge stays disabled until green).`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
