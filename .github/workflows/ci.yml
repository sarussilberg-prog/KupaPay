    # Only run for PRs targeting dev — PRs to main are reviewed and merged manually.
    if: github.event.pull_request.draft == false && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    # Serialize merge + bump across PRs so two concurrent merges can't race on
    # version.json (each PR merge produces exactly one patch bump).
    concurrency:
      group: dev-merge-and-bump
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Wait for SonarCloud quality gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            if gh pr checks "$PR_NUMBER" --repo "$REPO" 2>/dev/null | grep -E 'SonarCloud Code Analysis' | grep -q pass; then
              echo "SonarCloud passed"
              exit 0
            fi
            if gh pr checks "$PR_NUMBER" --repo "$REPO" 2>/dev/null | grep -E 'SonarCloud Code Analysis' | grep -q fail; then
              echo "::error::SonarCloud quality gate failed"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for SonarCloud"
          exit 1

      - name: Squash-merge the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR_NUMBER" --squash --repo "$REPO" --auto

      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Bump dev prerelease + changelog
        if: >-
          !startsWith(github.head_ref, 'chore/version-bump/') &&
          !startsWith(github.head_ref, 'chore/dev-version/')
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin dev
          git checkout dev
          git pull origin dev

          node cost-share-app/scripts/bump-dev-prerelease.mjs
          git add cost-share-app/packages/shared/version.json CHANGELOG.md
          git commit -m "chore: bump dev prerelease [skip ci]"
          git push origin dev
          echo "✅ Dev prerelease bumped (push skipped CI/Vercel via [skip ci])"
