name: CI

on:
  pull_request:
    branches: [dev, main, 'cursor/**']

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  setup:
    name: Install dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cost-share-app/package-lock.json
      - run: npm ci
      - run: npm run audit:ci
      - uses: actions/upload-artifact@v4
        with:
          name: npm-node-modules
          path: cost-share-app/node_modules
          if-no-files-found: error
          retention-days: 1

  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: npm-node-modules
          path: cost-share-app/node_modules
      - run: test -x node_modules/.bin/turbo || npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: npm-node-modules
          path: cost-share-app/node_modules
      - run: test -x node_modules/.bin/tsc || npm ci
      - run: npm run typecheck

  test:
    name: Mobile tests
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: npm-node-modules
          path: cost-share-app/node_modules
      - run: test -x node_modules/.bin/jest || npm ci
      - run: npm test --workspace=@cost-share/mobile -- --passWithNoTests --ci

  deno-edge-functions:
    name: Deno edge (${{ matrix.function }})
    strategy:
      fail-fast: true
      matrix:
        function:
          - revenuecat-webhook
          - send-push
          - pro-trial-reminder-dispatch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app/supabase/functions/${{ matrix.function }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - run: deno test --allow-env
      - name: Deploy bundle check (no import map)
        run: deno check --no-config index.ts

  migration-versions:
    name: Supabase migration version uniqueness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/supabase-unique-migration-versions.sh

  deno-edge-bundle-check:
    name: Deno edge bundle (all functions)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - run: bash scripts/ci-deno-check-edge-bundle.sh

  auto-merge:
    name: Auto-merge to dev
    needs: [lint, typecheck, test, deno-edge-functions, deno-edge-bundle-check, migration-versions]
    # Only run for PRs targeting dev — PRs to main are reviewed and merged manually.
    if: github.event.pull_request.draft == false && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    # Serialize merge + bump across PRs so two concurrent merges can't race on
    # version.json (each PR merge produces exactly one patch bump).
    concurrency:
      group: dev-merge-and-bump
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Wait for SonarCloud quality gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            if gh pr checks "$PR_NUMBER" --repo "$REPO" 2>/dev/null | grep -E 'SonarCloud Code Analysis' | grep -q pass; then
              echo "SonarCloud passed"
              exit 0
            fi
            if gh pr checks "$PR_NUMBER" --repo "$REPO" 2>/dev/null | grep -E 'SonarCloud Code Analysis' | grep -q fail; then
              echo "::error::SonarCloud quality gate failed"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for SonarCloud"
          exit 1

      - name: Squash-merge the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR_NUMBER" --squash --repo "$REPO" --auto

      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      # Version bump via a normal PR (GITHUB_TOKEN) — no ADMIN_PAT bypass of branch protection (#146, #213).
      - name: Bump patch version via follow-up PR
        if: "!startsWith(github.head_ref, 'chore/version-bump/')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION_FILE="cost-share-app/packages/shared/version.json"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin dev
          git checkout dev
          git pull origin dev

          current=$(jq -r '.version' "$VERSION_FILE")
          IFS='.' read -r major minor patch <<< "$current"
          new="${major}.${minor}.$((patch + 1))"
          jq -c --arg v "$new" '.version = $v' "$VERSION_FILE" > tmp.json && mv tmp.json "$VERSION_FILE"
          git add "$VERSION_FILE"
          git commit -m "chore: bump version ${current} → ${new}"

          BR="chore/version-bump/run-${{ github.run_id }}"
          git checkout -b "$BR"
          git push origin "$BR"

          if ! gh pr create --repo "$REPO" --base dev --head "$BR" \
            --title "chore: bump version ${current} → ${new}" \
            --body "Automated SSOT patch bump after a dev merge. Merges only after required CI checks pass (replaces ADMIN_PAT direct push). Related: #146 #213." \
            --draft; then
            echo "::warning::Could not open version-bump PR (enable Actions to create PRs, or bump manually)."
            exit 0
          fi
          gh pr merge "$BR" --repo "$REPO" --squash --auto || true
          echo "✅ Version bump PR opened for ${current} → ${new}"
