name: CI

on:
  pull_request:
    branches: [dev, main, 'cursor/**']

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  setup:
    name: Install dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cost-share-app/package-lock.json
      - run: npm ci
      - run: npm run audit:ci
      - uses: actions/upload-artifact@v4
        with:
          name: npm-node-modules
          path: cost-share-app/node_modules
          if-no-files-found: error
          retention-days: 1

  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: npm-node-modules
          path: cost-share-app/node_modules
      - run: test -x node_modules/.bin/turbo || npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: npm-node-modules
          path: cost-share-app/node_modules
      - run: test -x node_modules/.bin/tsc || npm ci
      - run: npm run typecheck

  test:
    name: Mobile tests
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: npm-node-modules
          path: cost-share-app/node_modules
      - run: test -x node_modules/.bin/jest || npm ci
      - run: npm test --workspace=@cost-share/mobile -- --passWithNoTests --ci

  legal-locale-parity:
    name: Legal locale parity
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: npm-node-modules
          path: cost-share-app/node_modules
      - run: test -x node_modules/.bin/jest || npm ci --ignore-scripts
      - run: bash scripts/ci-legal-locale-parity.sh

  deno-edge-functions:
    name: Deno edge (${{ matrix.function }})
    strategy:
      fail-fast: true
      matrix:
        function:
          - revenuecat-webhook
          - send-push
          - pro-trial-reminder-dispatch
          - storage-cleanup-dispatch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app/supabase/functions/${{ matrix.function }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - run: deno test --allow-env
      - name: Deploy bundle check (no import map)
        run: deno check --no-config index.ts

  no-merge-conflicts:
    name: No merge conflict markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci-no-merge-conflicts.sh

  expo-mobile-config:
    name: Expo mobile config
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: npm-node-modules
          path: cost-share-app/node_modules
      - run: test -x node_modules/.bin/expo || npm ci --ignore-scripts
      - run: bash scripts/ci-expo-mobile-config.sh

  migration-versions:
    name: Supabase migration version uniqueness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/supabase-unique-migration-versions.sh

  ci-performance:
    name: CI performance
    uses: ./.github/workflows/ci-performance.yml

  supabase-sql-integration:
    name: Supabase SQL integration
    uses: ./.github/workflows/supabase-sql-integration.yml

  deno-edge-bundle-check:
    name: Deno edge bundle (all functions)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - run: bash scripts/ci-deno-check-edge-bundle.sh

