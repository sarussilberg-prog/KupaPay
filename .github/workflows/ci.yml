name: CI

on:
  pull_request:
    branches: [dev, main, 'cursor/**']

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  setup:
    name: Install dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cost-share-app/package-lock.json
      - run: npm ci
      - run: npm run audit:ci
      - uses: actions/upload-artifact@v4
        with:
          name: npm-node-modules
          path: cost-share-app/node_modules
          if-no-files-found: error
          retention-days: 1

  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: npm-node-modules
          path: cost-share-app/node_modules
      - run: test -x node_modules/.bin/turbo || npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: npm-node-modules
          path: cost-share-app/node_modules
      - run: test -x node_modules/.bin/tsc || npm ci
      - run: npm run typecheck

  test:
    name: Mobile tests
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: npm-node-modules
          path: cost-share-app/node_modules
      - run: test -x node_modules/.bin/jest || npm ci
      - run: npm test --workspace=@cost-share/mobile -- --passWithNoTests --ci

  legal-locale-parity:
    name: Legal locale parity
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: npm-node-modules
          path: cost-share-app/node_modules
      - run: test -x node_modules/.bin/jest || npm ci --ignore-scripts
      - run: bash scripts/ci-legal-locale-parity.sh

  deno-edge-plan:
    name: Deno edge plan
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.plan.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          functions="$(bash cost-share-app/scripts/ci-deno-matrix-plan.sh)"
          echo "functions=${functions}" >> "$GITHUB_OUTPUT"
          echo "Planned Deno matrix: ${functions}"

  deno-edge-functions:
    name: Deno edge (${{ matrix.function }})
    needs: deno-edge-plan
    if: needs.deno-edge-plan.outputs.functions != '[]'
    strategy:
      fail-fast: true
      matrix:
        function: ${{ fromJSON(needs.deno-edge-plan.outputs.functions) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - run: bash scripts/ci-deno-edge-function.sh "${{ matrix.function }}"

  deno-edge-functions-skipped:
    name: Deno edge (skipped — no function paths changed)
    needs: deno-edge-plan
    if: needs.deno-edge-plan.outputs.functions == '[]'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No edge-function paths changed on this PR; Deno matrix skipped."

  deno-edge-gate:
    name: Deno edge gate
    needs: [deno-edge-plan, deno-edge-functions, deno-edge-functions-skipped]
    if: always() && !cancelled() && needs.deno-edge-plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify Deno matrix result
        run: |
          set -euo pipefail
          functions='${{ needs.deno-edge-plan.outputs.functions }}'
          if [[ "$functions" == "[]" ]]; then
            if [[ "${{ needs.deno-edge-functions-skipped.result }}" != "success" ]]; then
              echo "::error::expected skipped Deno job to succeed"
              exit 1
            fi
            echo "Deno edge checks skipped (no path changes)."
            exit 0
          fi
          if [[ "${{ needs.deno-edge-functions.result }}" != "success" ]]; then
            echo "::error::Deno edge matrix failed"
            exit 1
          fi
          echo "Deno edge matrix passed."

  no-merge-conflicts:
    name: No merge conflict markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci-no-merge-conflicts.sh

  expo-mobile-config:
    name: Expo mobile config
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: npm-node-modules
          path: cost-share-app/node_modules
      - run: test -x node_modules/.bin/expo || npm ci --ignore-scripts
      - run: bash scripts/ci-expo-mobile-config.sh

  migration-versions:
    name: Supabase migration version uniqueness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/supabase-unique-migration-versions.sh

  ci-performance:
    name: CI performance
    uses: ./.github/workflows/ci-performance.yml

  supabase-sql-integration:
    name: Supabase SQL integration
    uses: ./.github/workflows/supabase-sql-integration.yml

  deno-edge-bundle-check:
    name: Deno edge bundle (all functions)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - run: bash scripts/ci-deno-check-edge-bundle.sh

  auto-merge:
    name: Auto-merge to dev
    needs:
      [
        lint,
        typecheck,
        test,
        legal-locale-parity,
        deno-edge-gate,
        deno-edge-bundle-check,
        migration-versions,
        no-merge-conflicts,
        expo-mobile-config,
        ci-performance,
        supabase-sql-integration,
      ]
    # Only run for PRs targeting dev — PRs to main are reviewed and merged manually.
    if: github.event.pull_request.draft == false && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    # Serialize merge + bump across PRs so two concurrent merges can't race on
    # version.json (each PR merge produces exactly one patch bump).
    concurrency:
      group: dev-merge-and-bump
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Wait for SonarCloud quality gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            if gh pr checks "$PR_NUMBER" --repo "$REPO" 2>/dev/null | grep -E 'SonarCloud Code Analysis' | grep -q pass; then
              echo "SonarCloud passed"
              exit 0
            fi
            if gh pr checks "$PR_NUMBER" --repo "$REPO" 2>/dev/null | grep -E 'SonarCloud Code Analysis' | grep -q fail; then
              echo "::error::SonarCloud quality gate failed"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for SonarCloud"
          exit 1

      - name: Squash-merge the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR_NUMBER" --squash --repo "$REPO" --auto

      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Bump dev prerelease + changelog
        if: >-
          !startsWith(github.head_ref, 'chore/version-bump/') &&
          !startsWith(github.head_ref, 'chore/dev-version/')
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin dev
          git checkout dev
          git pull origin dev

          node cost-share-app/scripts/bump-dev-prerelease.mjs
          git add cost-share-app/packages/shared/version.json CHANGELOG.md
          git commit -m "chore: bump dev prerelease [skip ci]"
          git push origin dev
          echo "✅ Dev prerelease bumped (push skipped CI/Vercel via [skip ci])"
