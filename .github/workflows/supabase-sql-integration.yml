name: Supabase SQL integration

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      stress_runs:
        description: 'Repeat bootstrap+tests N times (manual flake check)'
        required: false
        default: '1'

concurrency:
  group: supabase-sql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  SUPABASE_CLI_VERSION: '2.121.0'
  SUPABASE_POSTGRES_IMAGE: ghcr.io/supabase/postgres:17.6.1.136

jobs:
  sql-integration:
    name: Supabase SQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cost-share-app/package-lock.json

      - name: Install Node deps (group ledger DB simulation)
        run: npm ci --ignore-scripts

      - name: Pin Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify pinned toolchain
        run: |
          set -euo pipefail
          source scripts/ci-supabase-versions.env
          test "$SUPABASE_CLI_VERSION" = "${{ env.SUPABASE_CLI_VERSION }}"
          test "$SUPABASE_POSTGRES_IMAGE" = "${{ env.SUPABASE_POSTGRES_IMAGE }}"
          supabase --version

      - name: Cache Supabase Postgres Docker image
        uses: actions/cache@v6
        id: pg-image-cache
        with:
          path: /tmp/supabase-postgres-image.tar
          key: supabase-postgres-${{ env.SUPABASE_POSTGRES_IMAGE }}

      - name: Load cached Postgres image
        if: steps.pg-image-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          if ! docker load -i /tmp/supabase-postgres-image.tar; then
            echo "::warning::Cached Postgres image tar corrupt — will pull fresh"
            rm -f /tmp/supabase-postgres-image.tar
            exit 1
          fi
        continue-on-error: true
        id: pg_cache_load

      - name: Pull Postgres image
        if: steps.pg-image-cache.outputs.cache-hit != 'true' || steps.pg_cache_load.outcome == 'failure'
        run: |
          set -euo pipefail
          image="${{ env.SUPABASE_POSTGRES_IMAGE }}"
          for attempt in 1 2 3 4 5; do
            if docker pull "$image"; then
              docker save "$image" -o /tmp/supabase-postgres-image.tar
              exit 0
            fi
            echo "::warning::docker pull attempt ${attempt}/5 failed (GHCR rate limit or network)"
            sleep $((attempt * 15))
          done
          echo "::error::Could not pull Postgres image after 5 attempts"
          exit 1

      - name: Lint migration filenames
        run: bash scripts/supabase-lint-migration-filenames.sh

      - name: Lint migrations enable RLS on new tables
        run: bash scripts/supabase-lint-migration-table-rls.sh

      - name: Migration chain (order + newer than base)
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_BASE_REF: ${{ github.base_ref || 'dev' }}
        run: bash scripts/supabase-migration-chain-check.sh

      - name: Check unique migration timestamp prefixes
        run: bash scripts/supabase-unique-migration-versions.sh

      - name: Bootstrap local Postgres stack
        run: |
          set -euo pipefail
          source scripts/ci-supabase-sql-lib.sh
          for attempt in 1 2; do
            if bash scripts/ci-supabase-sql-bootstrap.sh; then
              exit 0
            fi
            remove_pg_container
            if [[ "$attempt" -eq 1 ]]; then
              echo "::warning::Bootstrap attempt 1 failed — retrying once (Postgres/Docker flake)"
              sleep 15
            fi
          done
          exit 1

      - name: Run SQL regression tests
        run: bash scripts/ci-supabase-sql-run-tests.sh

      - name: Group ledger simulation (DB integration #641)
        run: bash scripts/ci-group-ledger-simulation-db.sh

      - name: Offline schema contract seed matches snapshot
        run: bash scripts/ci-verify-schema-contract-offline.sh

      - name: RPC/table schema contract (generated types surface)
        run: bash scripts/ci-supabase-types-contract.sh

      - name: Stress repeat (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.stress_runs != '1'
        env:
          STRESS_RUNS: ${{ github.event.inputs.stress_runs }}
        run: |
          set -euo pipefail
          source scripts/ci-supabase-sql-lib.sh
          runs="${STRESS_RUNS:-1}"
          for n in $(seq 2 "$runs"); do
            echo "▶ Stress iteration ${n}/${runs}"
            remove_pg_container
            bash scripts/ci-supabase-sql-bootstrap.sh
            bash scripts/ci-supabase-sql-run-tests.sh
          done

      - name: Stop Postgres container
        if: always()
        run: docker rm -f kupapay-sql-ci-postgres 2>/dev/null || true
