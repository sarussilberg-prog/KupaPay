name: Supabase SQL integration

on:
  pull_request:
    branches: [dev, main, 'cursor/**']
    paths:
      - 'cost-share-app/supabase/migrations/**'
      - 'cost-share-app/supabase/__tests__/**'
      - 'cost-share-app/supabase/config.toml'
      - 'cost-share-app/scripts/ci-supabase-sql-tests.sh'
      - '.github/workflows/supabase-sql-integration.yml'

concurrency:
  group: supabase-sql-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sql-integration:
    name: Supabase SQL tests
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run SQL regression suite (development DB)
        env:
          SUPABASE_ENV: development
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
        run: bash scripts/ci-supabase-sql-tests.sh
