# Prepare KupaPay iOS App Store release (IAP metadata, screenshots, version).
# Uses ASC API secrets — does NOT submit for review.
name: ASC iOS release prep

on:
  workflow_dispatch:
    inputs:
      skip_screenshots:
        description: Skip simulator screenshot generation (use repo PNGs only)
        type: boolean
        default: false
      skip_iap:
        description: Skip IAP metadata upload
        type: boolean
        default: false
      skip_version:
        description: Skip app version / What's New / build attach
        type: boolean
        default: false

concurrency:
  group: asc-ios-release-prep
  cancel-in-progress: false

jobs:
  generate_assets:
    name: Generate review & fallback screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cost-share-app/package-lock.json
      - name: Install dependencies
        working-directory: cost-share-app
        run: npm ci --ignore-scripts
      - name: Generate IAP review PNGs
        working-directory: cost-share-app/apps/mobile
        run: node scripts/generate-iap-review-screenshot.mjs
      - name: Fallback store screenshots (baseline)
        working-directory: cost-share-app/apps/mobile
        run: |
          node scripts/asc-generate-screenshots-fallback.mjs
          node scripts/asc-compose-store-screenshots.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-pregen
          path: |
            store/asc/review-screenshots/
            store/screenshots/ios/

  maestro_screenshots:
    name: Simulator screenshots (Maestro)
    if: inputs.skip_screenshots != true
    runs-on: macos-latest
    needs: generate_assets
    defaults:
      run:
        working-directory: cost-share-app/apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cost-share-app/package-lock.json
      - name: Install dependencies
        working-directory: cost-share-app
        run: npm ci --ignore-scripts
      - name: Install EAS CLI
        run: npm install -g eas-cli@24.12.1 --ignore-scripts
      - name: Build iOS simulator app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform ios --profile asc-screenshots --local --non-interactive --output ./KupaPay-Screenshot.tar.gz
          tar -xzf ./KupaPay-Screenshot.tar.gz
          APP="$(find . -maxdepth 2 -name '*.app' | head -1)"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Boot simulator & capture
        env:
          PATH: "$HOME/.maestro/bin:$PATH"
        run: |
          xcrun simctl boot "iPhone 16 Pro Max" 2>/dev/null || true
          open -a Simulator
          xcrun simctl install booted "$APP_PATH"
          bash scripts/asc-run-maestro-screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-maestro
          path: store/screenshots/ios/

  asc_apply:
    name: Apply metadata to App Store Connect
    runs-on: ubuntu-latest
    needs: [generate_assets, maestro_screenshots]
    if: |
      always() &&
      needs.generate_assets.result == 'success' &&
      (needs.maestro_screenshots.result == 'success' || needs.maestro_screenshots.result == 'skipped')
    defaults:
      run:
        working-directory: cost-share-app/apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: store-screenshots-*
          merge-multiple: true
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cost-share-app/package-lock.json
      - name: Install dependencies
        working-directory: cost-share-app
        run: npm ci --ignore-scripts
      - name: Write ASC API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: bash scripts/ci-write-asc-key.sh
      - name: Verify IAP prices (ILS)
        if: inputs.skip_iap != true
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_API_KEY_PATH: ${{ github.workspace }}/cost-share-app/apps/mobile/asc-api-key.p8
          ASC_APP_ID: "6780216665"
        run: node scripts/asc-verify-iap-prices.mjs
      - name: Update IAP metadata & review screenshots
        if: inputs.skip_iap != true
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_API_KEY_PATH: ${{ github.workspace }}/cost-share-app/apps/mobile/asc-api-key.p8
          ASC_APP_ID: "6780216665"
        run: |
          node scripts/generate-iap-review-screenshot.mjs
          node scripts/asc-update-iap-metadata.mjs
      - name: Upload listing screenshots
        if: inputs.skip_screenshots != true
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_API_KEY_PATH: ${{ github.workspace }}/cost-share-app/apps/mobile/asc-api-key.p8
          ASC_APP_ID: "6780216665"
        run: node scripts/asc-upload-screenshots.mjs
      - name: Prepare app version & What's New
        if: inputs.skip_version != true
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_API_KEY_PATH: ${{ github.workspace }}/cost-share-app/apps/mobile/asc-api-key.p8
          ASC_APP_ID: "6780216665"
        run: node scripts/asc-prepare-app-version.mjs
      - name: ASC status report
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_API_KEY_PATH: ${{ github.workspace }}/cost-share-app/apps/mobile/asc-api-key.p8
          ASC_APP_ID: "6780216665"
        run: node scripts/asc-report-status.mjs | tee asc-status-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: asc-status-report
          path: cost-share-app/apps/mobile/asc-status-report.json
