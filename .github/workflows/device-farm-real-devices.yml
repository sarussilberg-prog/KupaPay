# AWS Device Farm — real-device Maestro smoke before store releases (manual only).
# Default OFF: set repository variable DEVICE_FARM_ENABLED=true and configure secrets (see docs).
name: AWS Device Farm (real devices)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to run on Device Farm'
        type: choice
        options: [ios, android, both]
        default: both
      maestro_tier:
        description: 'Maestro flow set'
        type: choice
        options: [smoke]
        default: smoke

concurrency:
  group: device-farm-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  device-farm:
    name: Device Farm Maestro smoke
    if: vars.DEVICE_FARM_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: cost-share-app
    env:
      DEVICE_FARM_PROJECT_ARN: ${{ secrets.DEVICE_FARM_PROJECT_ARN }}
      DEVICE_FARM_DEVICE_POOL_ARN: ${{ secrets.DEVICE_FARM_DEVICE_POOL_ARN }}
      DEVICE_FARM_TEST_PACKAGE_ARN: ${{ secrets.DEVICE_FARM_TEST_PACKAGE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
    steps:
      - name: Gate (repository variable)
        run: |
          echo "DEVICE_FARM_ENABLED=${{ vars.DEVICE_FARM_ENABLED }}"
          if [[ "${{ vars.DEVICE_FARM_ENABLED }}" != "true" ]]; then
            echo "::error::Set repository variable DEVICE_FARM_ENABLED=true to run this workflow"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cost-share-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate AWS / Device Farm secrets
        run: |
          set -euo pipefail
          missing=0
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION DEVICE_FARM_PROJECT_ARN DEVICE_FARM_DEVICE_POOL_ARN; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing secret $key"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Configure AWS CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq awscli
          aws sts get-caller-identity

      - name: Compute native fingerprint (artifact cache key)
        id: fingerprint
        working-directory: cost-share-app/apps/mobile
        run: |
          hash="$(npx --yes @expo/fingerprint fingerprint:generate | tail -1 | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).hash)")"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore cached Android APK (Maestro Release)
        if: inputs.platform == 'android' || inputs.platform == 'both'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/maestro-android-apk
          key: maestro-android-apk-${{ steps.fingerprint.outputs.hash }}
          restore-keys: maestro-android-apk-

      - name: Device Farm — upload app and schedule Maestro smoke (Android)
        if: inputs.platform == 'android' || inputs.platform == 'both'
        env:
          PLATFORM: android
          MAESTRO_FLOW_PLAN_JSON: '[{"file":"sign-in.yaml","locales":null},{"file":"assert-layout-probes.yaml","locales":null},{"file":"visit-main-screens.yaml","locales":null}]'
        run: bash apps/mobile/scripts/ci-device-farm-maestro.sh android

      - name: Device Farm — upload app and schedule Maestro smoke (iOS)
        if: inputs.platform == 'ios' || inputs.platform == 'both'
        run: |
          echo "::warning::iOS Device Farm runs require a macOS-built .ipa uploaded separately; use Maestro macOS artifact pipeline or local ipa path DEVICE_FARM_IOS_APP_PATH"
          bash apps/mobile/scripts/ci-device-farm-maestro.sh ios

      - name: Upload run report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-farm-run-report-${{ github.run_id }}
          path: artifacts/device-farm
          if-no-files-found: warn
          retention-days: 30
