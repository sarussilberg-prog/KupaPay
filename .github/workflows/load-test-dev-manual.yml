name: Load test (dev, manual)

on:
  workflow_dispatch:

jobs:
  k6-dev-rpcs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Verify load-test secrets (LOAD_TEST_* or E2E_*)
        env:
          LOAD_TEST_SUPABASE_URL: ${{ secrets.LOAD_TEST_SUPABASE_URL }}
          LOAD_TEST_SUPABASE_ANON_KEY: ${{ secrets.LOAD_TEST_SUPABASE_ANON_KEY }}
          LOAD_TEST_PASSWORD: ${{ secrets.LOAD_TEST_PASSWORD }}
          LOAD_TEST_EMAIL: ${{ secrets.LOAD_TEST_EMAIL }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
        run: |
          set -euo pipefail
          missing=()
          if [[ -z "${LOAD_TEST_SUPABASE_URL:-}" && -z "${E2E_SUPABASE_URL:-}" ]]; then
            missing+=('LOAD_TEST_SUPABASE_URL or E2E_SUPABASE_URL')
          fi
          if [[ -z "${LOAD_TEST_SUPABASE_ANON_KEY:-}" && -z "${E2E_SUPABASE_ANON_KEY:-}" ]]; then
            missing+=('LOAD_TEST_SUPABASE_ANON_KEY or E2E_SUPABASE_ANON_KEY')
          fi
          if [[ -z "${LOAD_TEST_PASSWORD:-}" && -z "${E2E_TEST_PASSWORD:-}" ]]; then
            missing+=('LOAD_TEST_PASSWORD or E2E_TEST_PASSWORD')
          fi
          if ((${#missing[@]} > 0)); then
            echo '::error::Load test cannot run: missing required repository secrets.'
            printf '  - %s\n' "${missing[@]}"
            echo 'Optional: LOAD_TEST_EMAIL or E2E_TEST_EMAIL (defaults to e2e-playwright@kupay-dev.test).'
            echo 'See cost-share-app/scripts/load-test/README.md'
            exit 1
          fi

      - name: Install k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2

      - name: Validate load-test manifest (CI)
        run: npm run test:load-test --prefix cost-share-app

      - name: Prepare k6 auth (LOAD_TEST_* or E2E_* secrets)
        env:
          LOAD_TEST_SUPABASE_URL: ${{ secrets.LOAD_TEST_SUPABASE_URL }}
          LOAD_TEST_SUPABASE_ANON_KEY: ${{ secrets.LOAD_TEST_SUPABASE_ANON_KEY }}
          LOAD_TEST_PASSWORD: ${{ secrets.LOAD_TEST_PASSWORD }}
          LOAD_TEST_EMAIL: ${{ secrets.LOAD_TEST_EMAIL }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
        run: |
          set -euo pipefail
          export SUPABASE_URL="${LOAD_TEST_SUPABASE_URL:-$E2E_SUPABASE_URL}"
          export SUPABASE_ANON_KEY="${LOAD_TEST_SUPABASE_ANON_KEY:-$E2E_SUPABASE_ANON_KEY}"
          export LOAD_TEST_PASSWORD="${LOAD_TEST_PASSWORD:-$E2E_TEST_PASSWORD}"
          export LOAD_TEST_EMAIL="${LOAD_TEST_EMAIL:-$E2E_TEST_EMAIL}"
          node cost-share-app/scripts/load-test/prepare-k6-env.mjs >> "$GITHUB_ENV"

      - name: Run k6 against dev
        env:
          K6_VUS: '10'
          K6_DURATION: '45s'
        run: |
          cd cost-share-app/scripts/load-test
          # Keep k6's exit code (thresholds) instead of tee's, but still publish the summary.
          set +e
          k6 run k6-dev-rpcs.js | tee k6-summary.txt
          rc=${PIPESTATUS[0]}
          cat k6-summary.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
