name: Load test (dev, manual)

on:
  workflow_dispatch:

jobs:
  k6-dev-rpcs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC6D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Run k6 against dev (optional secrets)
        env:
          SUPABASE_URL: ${{ secrets.LOAD_TEST_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.LOAD_TEST_SUPABASE_ANON_KEY }}
          K6_USER_JWT: ${{ secrets.LOAD_TEST_USER_JWT }}
          K6_VUS: '10'
          K6_DURATION: '45s'
        run: |
          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_ANON_KEY:-}" || -z "${K6_USER_JWT:-}" ]]; then
            echo "Skipping k6: set LOAD_TEST_* repository secrets to run dev RPC load test."
            echo "See cost-share-app/scripts/load-test/README.md"
            exit 0
          fi
          cd cost-share-app/scripts/load-test
          k6 run k6-dev-rpcs.js | tee "$GITHUB_STEP_SUMMARY"
