name: Load test (dev, manual)

on:
  workflow_dispatch:

jobs:
  k6-dev-rpcs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC6D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Validate load-test manifest (CI)
        run: npm run test:load-test --prefix cost-share-app
      - name: Prepare k6 auth (LOAD_TEST_* or E2E_* secrets)
        id: auth
        env:
          LOAD_TEST_SUPABASE_URL: ${{ secrets.LOAD_TEST_SUPABASE_URL }}
          LOAD_TEST_SUPABASE_ANON_KEY: ${{ secrets.LOAD_TEST_SUPABASE_ANON_KEY }}
          LOAD_TEST_PASSWORD: ${{ secrets.LOAD_TEST_PASSWORD }}
          LOAD_TEST_EMAIL: ${{ secrets.LOAD_TEST_EMAIL }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
        run: |
          set -euo pipefail
          export SUPABASE_URL="${LOAD_TEST_SUPABASE_URL:-$E2E_SUPABASE_URL}"
          export SUPABASE_ANON_KEY="${LOAD_TEST_SUPABASE_ANON_KEY:-$E2E_SUPABASE_ANON_KEY}"
          export LOAD_TEST_PASSWORD="${LOAD_TEST_PASSWORD:-$E2E_TEST_PASSWORD}"
          export LOAD_TEST_EMAIL="${LOAD_TEST_EMAIL:-$E2E_TEST_EMAIL}"
          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_ANON_KEY:-}" || -z "${LOAD_TEST_PASSWORD:-}" ]]; then
            echo "skip_k6=true" >> "$GITHUB_OUTPUT"
            echo "Skipping k6: configure LOAD_TEST_* or E2E_* repository secrets."
            echo "See cost-share-app/scripts/load-test/README.md"
            exit 0
          fi
          echo "skip_k6=false" >> "$GITHUB_OUTPUT"
          node cost-share-app/scripts/load-test/prepare-k6-env.mjs >> "$GITHUB_ENV"
      - name: Run k6 against dev
        if: steps.auth.outputs.skip_k6 != 'true'
        env:
          K6_VUS: '10'
          K6_DURATION: '45s'
        run: |
          cd cost-share-app/scripts/load-test
          k6 run k6-dev-rpcs.js | tee k6-summary.txt
          cat k6-summary.txt >> "$GITHUB_STEP_SUMMARY"
