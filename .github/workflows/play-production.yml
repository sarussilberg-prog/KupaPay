# EAS cloud Android AAB (production profile) + Google Play production track submit.
name: Play Production Android

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to build (use main after release merge)
        type: string
        default: main
      pro_enabled:
        description: Enable KupaPay Pro (RevenueCat) — keep false until Paid Apps agreement
        type: boolean
        default: false

concurrency:
  group: play-production-android
  cancel-in-progress: true

jobs:
  play-production:
    name: Build AAB & submit to Play production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cost-share-app/apps/mobile

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Preflight secrets
        id: preflight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ] || [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Missing EXPO_TOKEN or GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.preflight.outputs.ready == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cost-share-app/package-lock.json

      - name: Install dependencies
        if: steps.preflight.outputs.ready == 'true'
        working-directory: cost-share-app
        run: npm ci --ignore-scripts

      - name: Install EAS CLI
        if: steps.preflight.outputs.ready == 'true'
        run: npm install -g eas-cli@24.12.1 --ignore-scripts

      - name: Write Google Play service account key
        if: steps.preflight.outputs.ready == 'true'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: bash scripts/ci-write-google-play-key.sh

      - name: Require RevenueCat Android key when Pro enabled
        if: steps.preflight.outputs.ready == 'true' && inputs.pro_enabled == true
        env:
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_PUBLIC_REVENUECAT_ANDROID_KEY:-}" ]; then
            echo "::error::EXPO_PUBLIC_REVENUECAT_ANDROID_KEY is required when pro_enabled=true"
            exit 1
          fi

      - name: Build Android AAB on EAS & submit to Play production
        if: steps.preflight.outputs.ready == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_KUPAPAY_PRO_ENABLED: ${{ inputs.pro_enabled == true && 'true' || 'false' }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
          EXPO_PUBLIC_ADMOB_IOS_APP_ID: ca-app-pub-8860544182475196~4183153126
          EXPO_PUBLIC_ADMOB_ANDROID_APP_ID: ca-app-pub-8860544182475196~8155234876
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
        run: |
          set -euo pipefail
          chmod +x scripts/eas-submit-play-production.sh
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait
          bash scripts/eas-submit-play-production.sh
          echo "Play production upload complete"
