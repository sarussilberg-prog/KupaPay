# Manual TestFlight upload: macOS runner + `eas build --local` (no EAS cloud build quota).
# Upload only — does not submit for App Store review.
#
# Secrets: see docs/TESTFLIGHT_GITHUB_ACTIONS.md
name: TestFlight iOS

on:
  workflow_dispatch:
    inputs:
      pro_enabled:
        description: Enable KupaPay Pro (RevenueCat) for this TestFlight build
        type: boolean
        default: true
  push:
    branches: [dev]
    paths:
      - 'cost-share-app/apps/mobile/**'
      - 'cost-share-app/packages/shared/**'
      - 'cost-share-app/package.json'
      - 'cost-share-app/package-lock.json'

concurrency:
  group: testflight-ios
  cancel-in-progress: true

jobs:
  testflight:
    name: Build & submit to TestFlight
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: cost-share-app/apps/mobile

    steps:
      - uses: actions/checkout@v4

      - name: Skip on [skip mobile cd] or missing secrets
        id: preflight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if echo "${{ github.event.head_commit.message }}" | grep -qiE '\[skip mobile cd\]'; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping TestFlight ([skip mobile cd] in commit message)"
            exit 0
          fi
          if [ -z "${EXPO_TOKEN:-}" ] || [ -z "${ASC_API_KEY_P8:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping TestFlight — set EXPO_TOKEN and ASC_API_KEY_P8 to enable auto builds on dev push"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.ready == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cost-share-app/package-lock.json

      - name: Install dependencies
        if: steps.preflight.outputs.ready == 'true'
        working-directory: cost-share-app
        run: npm ci --ignore-scripts

      - name: Install EAS CLI
        if: steps.preflight.outputs.ready == 'true'
        run: npm install -g eas-cli@24.12.1 --ignore-scripts

      - name: Write ASC API key
        if: steps.preflight.outputs.ready == 'true'
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: bash scripts/ci-write-asc-key.sh

      - name: Sync EAS iOS buildNumber with App Store Connect
        if: steps.preflight.outputs.ready == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_API_KEY_PATH: ${{ github.workspace }}/cost-share-app/apps/mobile/asc-api-key.p8
          ASC_APP_ID: "6780216665"
        run: node scripts/sync-eas-ios-build-number.mjs

      - name: Require RevenueCat iOS key when Pro enabled
        if: >-
          steps.preflight.outputs.ready == 'true' &&
          (github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' && inputs.pro_enabled == true))
        env:
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_PUBLIC_REVENUECAT_IOS_KEY:-}" ]; then
            echo "::error::EXPO_PUBLIC_REVENUECAT_IOS_KEY is required when pro_enabled=true (GitHub Actions secret appl_…)"
            exit 1
          fi
          echo "RevenueCat iOS key present (${#EXPO_PUBLIC_REVENUECAT_IOS_KEY} chars)"

      - name: Build iOS locally & submit to TestFlight
        if: steps.preflight.outputs.ready == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_API_KEY_PATH: ${{ github.workspace }}/cost-share-app/apps/mobile/asc-api-key.p8
          ASC_APP_ID: "6780216665"
          EXPO_PUBLIC_KUPAPAY_PRO_ENABLED: ${{ (github.event_name == 'push' || inputs.pro_enabled == true) && 'true' || 'false' }}
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          # Sentry source maps (optional — app.config.ts sets SENTRY_DISABLE_AUTO_UPLOAD when token absent)
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
        run: |
          source scripts/ci-export-asc-env.sh
          eas build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --output ./build-kupapay.ipa
          bash scripts/eas-submit-testflight.sh ./build-kupapay.ipa
          EXPECTED="$(eas build:version:get -p ios 2>/dev/null | grep -oE '[0-9]+$' || jq -r '.expo.ios.buildNumber' app.json)"
          node scripts/asc-poll-build.mjs "$EXPECTED"
          NOTES="$(node scripts/changelog-testflight-notes.mjs)"
          node scripts/asc-set-testflight-notes.mjs "$EXPECTED" "$NOTES"
          node scripts/record-testflight-version.mjs
      - name: Commit TestFlight changelog baseline
        if: steps.preflight.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cost-share-app/packages/shared/version.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore: record TestFlight changelog baseline [skip ci]"
          git push origin "${{ github.ref_name }}"
