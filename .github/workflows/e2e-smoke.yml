name: E2E smoke (Playwright + Maestro)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (on-demand)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cost-share-app/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - name: Run Playwright (requires E2E_BASE_URL / E2E_EXPO_WEB_URL secrets)
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_EXPO_WEB_URL: ${{ secrets.E2E_EXPO_WEB_URL }}
        run: npx playwright test

  maestro-smoke:
    name: Maestro (scaffold / nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Maestro flows registered
        run: |
          echo "Maestro flows live under apps/mobile/.maestro/"
          echo "Use workflow_dispatch on a macOS runner or Maestro Cloud for device E2E."
          test -f apps/mobile/.maestro/asc/capture-all-screens.yaml
