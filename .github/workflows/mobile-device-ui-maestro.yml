# Non-blocking Maestro device UI on PRs (iOS). Does not hold the main CI concurrency group.
name: Mobile device UI (Maestro)

on:
  pull_request:
    branches: [dev, main, 'cursor/**']
    paths:
      - 'cost-share-app/apps/mobile/**'
      - 'cost-share-app/packages/shared/**'
      - 'cost-share-app/scripts/seed-e2e-dev-user.ts'
      - '.github/workflows/mobile-device-ui-maestro.yml'

concurrency:
  group: maestro-ui-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  maestro-ios:
    name: Mobile device UI (Maestro iOS)
    # Informational only — failures do not block CI gate / auto-merge.
    continue-on-error: true
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: cost-share-app
    env:
      EXPO_PUBLIC_E2E_MAESTRO_AUTH: 'true'
      IOS_SIMULATOR_DEVICES: iPhone 16
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cost-share-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Maestro device UI (iOS simulator)
        run: bash apps/mobile/scripts/ci-maestro-device-ui.sh ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-device-ui-ios-${{ github.run_id }}
          path: artifacts/maestro-device-ui/screenshots
          if-no-files-found: warn
          retention-days: 7
