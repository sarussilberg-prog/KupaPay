name: Growth metrics weekly

on:
  schedule:
    # Monday 08:00 UTC — MAU / north-star snapshot for #422
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  postgres-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cost-share-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cost-share-app/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Print growth metrics (optional secrets)
        env:
          SUPABASE_URL: ${{ secrets.GROWTH_METRICS_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.GROWTH_METRICS_SUPABASE_ANON_KEY }}
          GROWTH_METRICS_ADMIN_JWT: ${{ secrets.GROWTH_METRICS_ADMIN_JWT }}
          GROWTH_METRICS_FORMAT: markdown
        run: |
          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_ANON_KEY:-}" || -z "${GROWTH_METRICS_ADMIN_JWT:-}" ]]; then
            echo "Skipping RPC call: set GROWTH_METRICS_* repository secrets to enable weekly Postgres snapshot."
            echo "See docs/SSOT/POSTHOG_EVENT_TAXONOMY.md and cost-share-app/analytics/growth-metrics-snapshot.sql"
            exit 0
          fi
          node scripts/print-growth-metrics.mjs | tee -a "$GITHUB_STEP_SUMMARY"
