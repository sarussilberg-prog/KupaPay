appId: com.kupapay.mobile
env:
  APP_LANG: he
---
- runFlow: sign-in.yaml
- runFlow: set-app-language.yaml
- runFlow: visit-main-screens.yaml
- tapOn:
    id: tab-Profile
- extendedWaitUntil:
    visible:
      id: profile-settings-button
    timeout: 60000
- takeScreenshot: ${MAESTRO_PLATFORM}_${APP_LANG}_05_profile
- tapOn:
    id: profile-settings-button
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 30000
- takeScreenshot: ${MAESTRO_PLATFORM}_${APP_LANG}_06_settings
- runFlow: assert-groups-layout-diagnostics-he.yaml
