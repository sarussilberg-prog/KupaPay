appId: com.kupapay.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: groups-list-title
    timeout: 90000
- runFlow:
    file: set-app-language.yaml
    env:
      APP_LANG: he
- extendedWaitUntil:
    visible:
      id: groups-layout-app-rtl
    timeout: 90000
- runFlow: assert-groups-layout-diagnostics-he.yaml
