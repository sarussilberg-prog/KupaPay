appId: com.kupapay.mobile
---
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 45000
    optional: true
- runFlow:
    when:
      notVisible:
        id: login-screen
    commands:
      - extendedWaitUntil:
          visible:
            id: onboarding-welcome-start
          timeout: 120000
      - waitForAnimationToEnd:
          timeout: 15000
      - extendedWaitUntil:
          visible:
            id: onboarding-welcome-existing
          timeout: 30000
      - tapOn:
          id: onboarding-welcome-existing
      - waitForAnimationToEnd:
          timeout: 15000
      - extendedWaitUntil:
          visible:
            id: login-screen
          timeout: 120000
