appId: com.kupapay.mobile
---
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: login-e2e-panel
    timeout: 30000
- tapOn:
    id: login-e2e-email
- eraseText
- inputText: ${E2E_EMAIL}
- tapOn:
    id: login-e2e-password
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: login-e2e-submit
- extendedWaitUntil:
    visible:
      id: groups-list-title
    timeout: 120000
