appId: com.kupapay.mobile
---
# Boot can show AppGateSkeleton before onboarding or login.
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 45000
    optional: true
- runFlow:
    when:
      visible:
        id: onboarding-welcome-existing
    commands:
      - extendedWaitUntil:
          visible:
            id: onboarding-welcome-existing
          timeout: 120000
      - tapOn:
          id: onboarding-welcome-existing
- runFlow:
    when:
      visible:
        id: onboarding-feature-skip
    commands:
      - tapOn:
          id: onboarding-feature-skip
