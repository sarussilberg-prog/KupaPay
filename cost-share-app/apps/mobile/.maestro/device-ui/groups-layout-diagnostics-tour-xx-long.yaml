appId: com.kupapay.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: groups-list-title
    timeout: 90000
# xx-long via Settings leaves Maestro off the tab bar (no native reload); deep-link instead.
- openLink: com.kupapay.mobile://e2e-fixture?lang=xx-long
- extendedWaitUntil:
    visible:
      id: e2e-fixture-pseudo-ready
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: groups-list-title
    timeout: 120000
- runFlow: assert-groups-layout-diagnostics.yaml
