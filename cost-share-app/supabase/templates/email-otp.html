<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your KupaPay sign-in code</title>
</head>
<body style="margin:0;padding:0;background:#F0F7FF;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F0F7FF;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:420px;background:#ffffff;border-radius:16px;border:1px solid #E0EDFF;padding:32px 28px;">
          <tr>
            <td align="center" style="padding-bottom:16px;">
              <div style="font-size:22px;font-weight:700;color:#1E3A8A;letter-spacing:-0.02em;">KupaPay</div>
            </td>
          </tr>
          <tr>
            <td style="font-size:16px;line-height:1.5;color:#374151;text-align:center;">
              Your sign-in code is:
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:20px 0;">
              <div style="display:inline-block;font-size:32px;font-weight:700;letter-spacing:0.35em;color:#1D4ED8;background:#EFF6FF;border-radius:12px;padding:16px 24px;">
                {{ .Token }}
              </div>
            </td>
          </tr>
          <tr>
            <td style="font-size:14px;line-height:1.5;color:#6B7280;text-align:center;">
              Enter this 6-digit code in the app. It expires soon. If you did not request this, you can ignore this email.
            </td>
          </tr>
          <tr>
            <td style="padding-top:24px;font-size:12px;color:#9CA3AF;text-align:center;">
              © KupaPay · Split expenses with friends
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
