# Minimal Supabase CLI config for remote migrations (CI: supabase db push).
# Local `supabase start` is optional; most schema work uses linked remote projects.
# See docs/SSOT/SUPABASE_ENVIRONMENTS.md

project_id = "drxfbicunusmipdgbgdk"

[db]
major_version = 17

[db.migrations]
enabled = true

# invite-landing serves public web pages (assetlinks.json, legal/*, /i/*, /g/*,
# account-deletion). Browsers, Google crawlers, and Play App Links verification
# do NOT send a JWT, so JWT verification must be disabled. RLS still protects
# the underlying tables — the function uses the anon key.
[functions.invite-landing]
verify_jwt = false

# send-push is invoked by the activity_events pg_net trigger (no JWT; validated via
# the x-webhook-secret header against the PUSH_WEBHOOK_SECRET function secret).
[functions.send-push]
verify_jwt = false

# RevenueCat server notifications (Authorization header secret; no JWT).
[functions.revenuecat-webhook]
verify_jwt = false

# Daily cron (x-webhook-secret) — server fallback for Pro trial end reminders.
[functions.pro-trial-reminder-dispatch]
verify_jwt = false

# Hourly cron (x-webhook-secret) — deletes orphaned profile avatars / receipt objects.
[functions.storage-cleanup-dispatch]
verify_jwt = false

# Daily cron (x-webhook-secret) — generates due Pro recurring expenses.
[functions.pro-recurring-expense-dispatch]
verify_jwt = false

# Daily cron (x-webhook-secret) — smart payment reminder batch.
[functions.pro-smart-reminder-dispatch]
verify_jwt = false

# Hourly cron (#402) — free retention unsettled-balance nudges.
[functions.retention-unsettled-nudge-dispatch]
verify_jwt = false

# Every 15m cron (#402) — deliver pushes deferred for quiet hours.
[functions.flush-deferred-push]
verify_jwt = false

# Daily cron (#404) — lifecycle email (Resend / Auth SMTP provider).
[functions.email-lifecycle-dispatch]
verify_jwt = false

# Weekly cron (#405) — activity digest push + email.
[functions.weekly-summary-dispatch]
verify_jwt = false

# Daily cron (#406) — Pro trial day 1/10/13 push nudges.
[functions.pro-trial-lifecycle-dispatch]
verify_jwt = false

# Hourly cron (#400) — RevenueCat promotional Pro for qualified referrals.
[functions.referral-reward-dispatch]
verify_jwt = false

# Client-invoked after redeem_promo_code — RevenueCat promotional Pro sync.
[functions.promo-code-redeem]
verify_jwt = true

# User JWT required; handler re-checks group membership + Pro via RPC.
[functions.receipt-ocr]
verify_jwt = true

# User JWT required; handler re-checks is_app_admin() before proxying Sentry.
[functions.admin-sentry-proxy]
verify_jwt = true
